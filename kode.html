<!DOCTYPE html>
<html lang="id">
<head>
  <title>Kode AbsenYukk</title>
  <meta charset="UTF-8">
  <meta name="description" content="Halaman kode 6 angka dinamis untuk absensi apel pagi">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SDK Firebase (App + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #1b2340;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
    }

    .panel {
      width: 100%;
      max-width: 460px;
      background-color: white;
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #8891a8;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 22px;
      color: #1b2340;
      margin-bottom: 6px;
    }

    .petunjuk {
      font-size: 13px;
      color: #8891a8;
      margin-bottom: 18px;
    }

    /* Kotak kode besar */
    .kode-box {
      border: 2px solid #e4e7ee;
      border-radius: 14px;
      padding: 26px 8px;
      margin-bottom: 16px;
      background-color: #f7f8fb;
    }

    #kode {
      font-size: clamp(40px, 14vw, 72px);
      font-weight: 800;
      letter-spacing: 6px;
      color: #1b2340;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* Bar hitung mundur */
    .bar {
      height: 8px;
      background-color: #e4e7ee;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .bar-isi {
      height: 100%;
      width: 100%;
      background-color: #3a63f0;
      transition: width 0.25s linear;
    }

    .hitung {
      font-size: 13px;
      color: #555f78;
      margin-bottom: 14px;
    }

    .info {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: #eef1f6;
      color: #4a5578;
    }

    .info.ok {
      background-color: #e5f6ec;
      color: #1f7a44;
    }

    .info.bad {
      background-color: #fbe9e9;
      color: #b13a3a;
    }
  </style>
</head>

<body>

  <div class="panel">
    <div class="eyebrow">Apel Pagi &middot; SMK</div>
    <h1>Kode Absen</h1>
    <div class="petunjuk">Ketik kode ini di halaman absen di HP kamu</div>

    <div class="kode-box"><div id="kode">--- ---</div></div>

    <div class="bar"><div class="bar-isi" id="barIsi"></div></div>
    <div class="hitung" id="hitung">Menyiapkan kode...</div>

    <div class="info" id="info">Menghubungkan ke server...</div>
  </div>

  <script>

    /* =========================================================
       KONFIGURASI
       ========================================================= */

    // false = kode bisa dipakai banyak siswa sampai waktunya habis
    //         (disarankan, soalnya siswa butuh beberapa detik buat ngetik).
    // true  = 1 kode cuma bisa dipakai 1 siswa, lalu langsung ganti
    //         (siswa lain yang lagi ngetik bakal ditolak & harus antre).
    const SEKALI_PAKAI = false;

    // Kode otomatis ganti tiap sekian detik.
    const INTERVAL_DETIK = 60;

    // Setelah kode ganti, kode LAMA masih diterima sekian detik
    // (biar siswa yang lagi ngetik gak langsung gagal).
    // Cuma berlaku kalau SEKALI_PAKAI = false.
    const GRACE_DETIK = 20;

    // Config Firebase — HARUS sama persis dengan yang di index.html
    const firebaseConfig = {
      apiKey: "AIzaSyBCB2WWCL-iyy6v87JFSSN7QmnRNymiOoY",
      authDomain: "absensiyukk.firebaseapp.com",
      projectId: "absensiyukk",
      storageBucket: "absensiyukk.firebasestorage.app",
      messagingSenderId: "543728960246",
      appId: "1:543728960246:web:a9f07fae0fe738d0cea2d7",
      measurementId: "G-X34TL4P82S"
    };


    /* =========================================================
       INISIALISASI FIREBASE
       ========================================================= */
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Satu dokumen "aktif" menyimpan kode yang sedang berlaku
    const kodeRef = db.collection("kode_absen").doc("aktif");


    /* =========================================================
       FUNGSI BANTUAN
       ========================================================= */
    let kodeSekarang = null;    // kode yang sedang tampil
    let kadaluarsaSekarang = 0; // kapan kode ini habis (ms)
    let timerGanti = null;

    // Bikin kode acak 6 angka (000000 - 999999)
    function acakKode() {
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return (arr[0] % 1000000).toString().padStart(6, "0");
    }

    function tampilKode(kode) {
      // "482913" -> "482 913" biar gampang dibaca
      document.getElementById("kode").textContent =
        kode.slice(0, 3) + " " + kode.slice(3);
    }

    function setInfo(jenis, teks) {
      const el = document.getElementById("info");
      el.className = "info " + jenis;
      el.textContent = teks; // textContent biar nama siswa gak bisa nyuntik HTML
    }


    /* =========================================================
       GANTI KODE — dipanggil saat halaman dibuka, saat waktu
       habis, dan (mode sekali pakai) saat kode sudah dipakai.
       ========================================================= */
    async function gantiKode() {
      clearTimeout(timerGanti);

      let kodeBaru = acakKode();
      while (kodeBaru === kodeSekarang) kodeBaru = acakKode();

      const sekarang = Date.now();
      const kadaluarsa = sekarang + INTERVAL_DETIK * 1000;

      // Kode lama masih diterima sebentar (masa tenggang)
      const pakaiTenggang = !SEKALI_PAKAI && kodeSekarang;

      try {
        // Simpan dulu ke Firestore, baru ditampilkan,
        // biar kode yang tampil pasti sudah valid di server.
        await kodeRef.set({
          kode: kodeBaru,
          dibuat: sekarang,
          kadaluarsa: kadaluarsa,
          sekali_pakai: SEKALI_PAKAI,
          dipakai: false,
          dipakai_oleh: null,
          kode_lama: pakaiTenggang ? kodeSekarang : null,
          kode_lama_sampai: pakaiTenggang ? sekarang + GRACE_DETIK * 1000 : 0
        });
      } catch (err) {
        console.error("Gagal simpan kode:", err);
        setInfo("bad", "Gagal terhubung ke Firestore. Cek koneksi / aturan (rules). Mencoba lagi...");
        timerGanti = setTimeout(gantiKode, 5000);
        return;
      }

      kodeSekarang = kodeBaru;
      kadaluarsaSekarang = kadaluarsa;
      tampilKode(kodeBaru);

      timerGanti = setTimeout(gantiKode, INTERVAL_DETIK * 1000);
    }


    /* =========================================================
       PANTAU FIRESTORE — dipakai buat mode sekali pakai: kalau
       kode yang tampil sudah dipakai siswa, langsung ganti baru.
       ========================================================= */
    kodeRef.onSnapshot((snap) => {
      if (!snap.exists) return;
      const d = snap.data();

      if (d.kode === kodeSekarang && d.dipakai === true) {
        setInfo("ok", "Dipakai oleh " + d.dipakai_oleh + " — kode diganti...");
        gantiKode();
      } else if (d.kode === kodeSekarang && !d.dipakai && !snap.metadata.hasPendingWrites) {
        setInfo("info", SEKALI_PAKAI
          ? "Kode aktif. Berlaku untuk 1 siswa, lalu otomatis berganti."
          : "Kode aktif. Otomatis berganti tiap " + INTERVAL_DETIK + " detik.");
      }
    }, (err) => {
      console.error("Listener error:", err);
      setInfo("bad", "Koneksi ke server terputus.");
    });


    /* =========================================================
       HITUNG MUNDUR — update bar & teks tiap 250 ms
       ========================================================= */
    setInterval(() => {
      if (!kodeSekarang) return;
      const sisaMs = Math.max(0, kadaluarsaSekarang - Date.now());
      const persen = (sisaMs / (INTERVAL_DETIK * 1000)) * 100;
      document.getElementById("barIsi").style.width = persen + "%";
      document.getElementById("hitung").textContent =
        "Kode berganti dalam " + Math.ceil(sisaMs / 1000) + " detik";
    }, 250);


    /* =========================================================
       MULAI — kode langsung muncul begitu halaman dibuka
       ========================================================= */
    gantiKode();

  </script>

</body>
</html>
